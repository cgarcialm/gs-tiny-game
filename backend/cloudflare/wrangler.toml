name = "gs-tiny-game-leaderboard"
main = "src/index.ts"
compatibility_date = "2026-02-20"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://cgarcialm.github.io"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_MAX_REQUESTS = "20"

[[d1_databases]]
binding = "DB"
database_name = "gs_tiny_game_leaderboard"
database_id = "<your-d1-database-id>"
